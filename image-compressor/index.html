<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Shrink Pro | HytechSoft</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }

        .glass-studio {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px -12px rgba(15, 23, 42, 0.05);
        }

        .comparison-slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 2rem;
            background-color: #f1f5f9;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .comparison-item {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .after-image {
            width: 50%;
            clip-path: inset(0 0 0 0);
            border-right: 2px solid #6366f1;
            z-index: 10;
        }

        .slider-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: #6366f1;
            cursor: ew-resize;
            z-index: 30;
            transform: translateX(-50%);
            touch-action: none;
        }

        .handle-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #6366f1;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        input[type=range] { accent-color: #6366f1; }
        select { appearance: none; -webkit-appearance: none; }
    </style>
</head>

<body class="selection:bg-indigo-100">

    <header class="sticky top-0 z-50 w-full border-b border-slate-200/60 bg-white/70 backdrop-blur-xl">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <a href="/" class="flex items-center gap-3 group">
                    <div class="relative h-12 w-12 flex items-center justify-center">
                        <div class="absolute inset-0 rounded-full bg-slate-50 border border-slate-100 shadow-inner"></div>
                        <div class="grid grid-cols-2 gap-0.5 p-2 transform group-hover:scale-110 transition-transform duration-500">
                            <div class="h-3 w-3 rounded-full bg-cyan-600"></div>
                            <div class="h-3 w-3 rounded-full bg-indigo-500"></div>
                            <div class="h-3 w-3 rounded-full bg-blue-400"></div>
                            <div class="h-3 w-3 rounded-full bg-slate-900 flex items-center justify-center overflow-hidden">
                                <span class="text-[8px] text-white font-bold italic">h</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="flex flex-col pr-4 border-r border-slate-200">
                            <span class="text-2xl font-black text-slate-900 tracking-tighter leading-none italic">HytechSoft</span>
                        </div>
                        <div class="pl-4">
                            <span class="text-[10px] font-medium text-slate-500 leading-tight block">Innovating<br>Intelligence</span>
                        </div>
                    </div>
                </a>
                <nav class="hidden md:flex items-center gap-8">
                    <a href="#tools" class="text-sm font-semibold text-slate-600 hover:text-cyan-600 transition-colors">Tools</a>
                    <a href="#" class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-bold text-white bg-slate-900 rounded-full hover:bg-slate-800 transition-all active:scale-95 shadow-lg shadow-slate-200">
                        Get Help
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <div class="mb-10 text-left">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50 text-indigo-600 text-[10px] font-bold uppercase tracking-widest mb-4">
                <i class="fa-solid fa-expand"></i> Smart Conversion Enabled
            </div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tight">Media <span class="text-indigo-600">Shrink Pro</span></h1>
        </div>

        <div class="grid lg:grid-cols-12 gap-8 items-start">
            
            <aside class="lg:col-span-4 space-y-6">
                <div class="glass-studio p-8 rounded-[2.5rem]">
                    <h3 class="font-bold text-slate-900 text-lg mb-8 flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-indigo-600"></i> Studio Config
                    </h3>

                    <div class="space-y-10">
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-[10px] font-black uppercase text-slate-400">Quality</label>
                                <span id="q-label" class="text-xl font-black text-indigo-600">80%</span>
                            </div>
                            <input type="range" id="quality" min="5" max="100" value="80" class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div class="space-y-4">
                            <label class="text-[10px] font-black uppercase text-slate-400">Export Format</label>
                            <div class="relative">
                                <select id="export-format" class="w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl font-bold text-slate-900 outline-none focus:border-indigo-400 transition-all cursor-pointer">
                                    <option value="image/jpeg">JPEG (Best for photos)</option>
                                    <option value="image/webp">WebP (Best compression)</option>
                                    <option value="image/png">PNG (Lossless)</option>
                                </select>
                                <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                    <i class="fa-solid fa-chevron-down text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <label class="text-[10px] font-black uppercase text-slate-400">Dimension Control</label>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Width (px)</span>
                                    <input type="number" id="resize-w" placeholder="Auto" class="w-full bg-transparent font-bold outline-none text-slate-900">
                                </div>
                                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                    <span class="text-[9px] font-bold text-slate-400 uppercase">Height (px)</span>
                                    <input type="number" id="resize-h" placeholder="Auto" class="w-full bg-transparent font-bold outline-none text-slate-900">
                                </div>
                            </div>
                        </div>

                        <div id="perf-dash" class="hidden p-6 bg-slate-900 rounded-[2rem] text-white space-y-4">
                            <div class="flex justify-between">
                                <span class="text-[10px] font-bold text-slate-500 uppercase">Original</span>
                                <span id="size-o" class="font-mono text-xs">0 KB</span>
                            </div>
                            <div class="flex justify-between border-b border-white/5 pb-4">
                                <span class="text-[10px] font-bold text-indigo-400 uppercase">Optimized</span>
                                <span id="size-n" class="font-mono text-xs text-indigo-400">0 KB</span>
                            </div>
                            <div class="text-center pt-2">
                                <h4 id="saving" class="text-5xl font-black text-emerald-400 tracking-tighter">-0%</h4>
                            </div>
                        </div>

                        <button id="dl-btn" disabled class="w-full py-5 bg-indigo-600 text-white rounded-2xl font-bold uppercase tracking-widest text-xs shadow-xl shadow-indigo-100 active:scale-95 transition-all disabled:opacity-20 flex items-center justify-center gap-3">
                            <i class="fa-solid fa-download"></i> Save Optimized
                        </button>
                    </div>
                </div>
            </aside>

            <div class="lg:col-span-8">
                <div id="drop-area" class="glass-studio p-4 min-h-[400px] lg:min-h-[600px] flex flex-col relative">
                    
                    <div id="view-empty" class="relative flex-grow flex flex-col items-center justify-center text-center p-12 rounded-[3rem] border-2 border-dashed border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/20 transition-all overflow-hidden">
                        <input type="file" id="fileInput" class="absolute inset-0 opacity-0 cursor-pointer z-10" accept="image/*">
                        
                        <div class="w-24 h-24 bg-white rounded-3xl shadow-xl flex items-center justify-center text-4xl text-indigo-600 mb-8 pointer-events-none">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <h2 class="text-2xl font-black text-slate-900 pointer-events-none">Select Media</h2>
                        <p class="text-slate-400 mt-2 font-medium pointer-events-none">Drag and drop or tap to process</p>
                    </div>

                    <div id="view-active" class="hidden flex-grow flex flex-col gap-4">
                        <div class="comparison-slider h-[350px] lg:h-[500px]" id="slider-root">
                            <img id="img-o" class="comparison-item">
                            <img id="img-n" class="comparison-item after-image">
                            
                            <div class="absolute top-6 left-6 z-20 px-3 py-1 bg-black/60 backdrop-blur-md text-white text-[9px] font-black uppercase rounded-lg pointer-events-none">Source</div>
                            <div class="absolute top-6 right-6 z-20 px-3 py-1 bg-indigo-600 text-white text-[9px] font-black uppercase rounded-lg pointer-events-none">Optimized</div>

                            <div class="slider-handle" id="slider-handle">
                                <div class="handle-circle">
                                    <i class="fa-solid fa-right-left"></i>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center px-4 py-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase">Drag slider to compare quality</span>
                            <button onclick="location.reload()" class="text-slate-400 hover:text-indigo-600 text-[10px] font-black uppercase transition-all">
                                <i class="fa-solid fa-circle-xmark mr-1"></i> Clear Studio
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ui = {
            q: document.getElementById('quality'), ql: document.getElementById('q-label'),
            fmt: document.getElementById('export-format'), // Format Selector
            rw: document.getElementById('resize-w'), rh: document.getElementById('resize-h'),
            io: document.getElementById('img-o'), in: document.getElementById('img-n'),
            so: document.getElementById('size-o'), sn: document.getElementById('size-n'),
            sv: document.getElementById('saving'), dl: document.getElementById('dl-btn'),
            fi: document.getElementById('fileInput'), ve: document.getElementById('view-empty'),
            va: document.getElementById('view-active'), pd: document.getElementById('perf-dash'),
            root: document.getElementById('slider-root'), handle: document.getElementById('slider-handle')
        };

        let rawFile = null;
        let originalImg = new Image();
        const MAX_DIM = 2500; 

        ui.fi.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                rawFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    originalImg.src = event.target.result;
                    originalImg.onload = () => {
                        let targetW = originalImg.width;
                        let targetH = originalImg.height;
                        if (targetW > MAX_DIM || targetH > MAX_DIM) {
                            const ratio = Math.min(MAX_DIM / targetW, MAX_DIM / targetH);
                            targetW = Math.floor(targetW * ratio);
                            targetH = Math.floor(targetH * ratio);
                        }
                        ui.io.src = event.target.result;
                        ui.rw.value = targetW;
                        ui.rh.value = targetH;
                        ui.ve.classList.add('hidden');
                        ui.va.classList.remove('hidden');
                        ui.pd.classList.remove('hidden');
                        runProcessing();
                    };
                };
                reader.readAsDataURL(file);
            }
        };

        function runProcessing() {
            if (!rawFile) return;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const w = parseInt(ui.rw.value) || originalImg.width;
            const h = parseInt(ui.rh.value) || originalImg.height;
            
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(originalImg, 0, 0, w, h);

            // Get selected format and quality
            const format = ui.fmt.value;
            const quality = ui.q.value / 100;
            
            const dataUrl = canvas.toDataURL(format, quality);
            ui.in.src = dataUrl;
            
            // Calc size (approximate from base64)
            const head = dataUrl.split(',')[0].length;
            const newSize = Math.round((dataUrl.length - head) * 3/4);
            
            ui.so.innerText = formatSize(rawFile.size);
            ui.sn.innerText = formatSize(newSize);
            
            const reduction = Math.round((1 - newSize / rawFile.size) * 100);
            ui.sv.innerText = reduction > 0 ? `-${reduction}%` : `0%`;
            ui.dl.disabled = false;
        }

        ui.q.oninput = (e) => { ui.ql.innerText = `${e.target.value}%`; runProcessing(); };
        ui.fmt.onchange = () => runProcessing(); // Re-process when format changes
        ui.rw.oninput = () => runProcessing();
        ui.rh.oninput = () => runProcessing();

        // Slider Handle
        let isDragging = false;
        const moveSlider = (e) => {
            if (!isDragging) return;
            const rect = ui.root.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left;
            if (x < 0) x = 0;
            if (x > rect.width) x = rect.width;
            const percent = (x / rect.width) * 100;
            ui.handle.style.left = percent + "%";
            ui.in.style.width = percent + "%";
        };

        ui.handle.addEventListener('mousedown', () => isDragging = true);
        ui.handle.addEventListener('touchstart', () => isDragging = true, {passive: true});
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('touchend', () => isDragging = false);
        window.addEventListener('mousemove', moveSlider);
        window.addEventListener('touchmove', moveSlider, {passive: false});

        ui.dl.onclick = () => {
            const extension = ui.fmt.value.split('/')[1]; // get 'jpeg' or 'webp' or 'png'
            const link = document.createElement('a');
            link.download = `optimized-${Date.now()}.${extension}`;
            link.href = ui.in.src;
            link.click();
        };

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024, sizes = ['B', 'KB', 'MB'], i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
