<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Java Online Compiler | Hytechsoft Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cjrtnc.leaningtech.com/3.0/cj3loader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .code-font { font-family: 'Fira Code', monospace; }
    .editor-line-numbers { background: #f1f5f9; border-right: 1px solid #e2e8f0; }
  </style>
</head>

<body class="text-slate-900 min-h-screen flex flex-col">

<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 group">
  <div class="relative h-12 w-12 flex items-center justify-center">
    <div class="absolute inset-0 rounded-full bg-slate-50 border border-slate-100 shadow-inner"></div>
    
    <div class="grid grid-cols-2 gap-0.5 p-2 transform group-hover:scale-110 transition-transform duration-500">
      <div class="h-3 w-3 rounded-full bg-cyan-600"></div>
      <div class="h-3 w-3 rounded-full bg-indigo-500"></div>
      <div class="h-3 w-3 rounded-full bg-blue-400"></div>
      <div class="h-3 w-3 rounded-full bg-slate-900 flex items-center justify-center overflow-hidden">
         <span class="text-[8px] text-white font-bold italic">h</span>
      </div>
    </div>
  </div>

  <div class="flex items-center">
    <div class="flex flex-col pr-4 border-r border-slate-200">
      <span class="text-2xl font-black text-slate-900 tracking-tighter leading-none italic">HytechSoft</span>
    
    </div>
    <div class="pl-4">
      <span class="text-[10px] font-medium text-slate-500 leading-tight block">Innovating<br>Intelligence</span>
    </div>
  </div>
</a>
    <div class="flex items-center gap-4">
        <button id="run-btn" class="bg-slate-900 hover:bg-slate-800 text-white px-8 py-2.5 rounded-full font-bold text-sm transition-all flex items-center gap-2 active:scale-95 shadow-xl shadow-slate-200">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Run Code
        </button>
    </div>
  </div>
</header>

<main class="flex-1 grid grid-cols-1 lg:grid-cols-2 overflow-hidden" style="height: calc(100vh - 64px);">
  
  <section class="flex flex-col border-r border-slate-200 bg-white">
    <div class="flex items-center justify-between px-6 py-3 bg-slate-50 border-b border-slate-200">
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Main.java</span>
        <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded">JDK 17.0</span>
    </div>
    <div class="flex flex-1 overflow-hidden relative">
        <div id="line-numbers"
     class="editor-line-numbers w-12 pt-4 text-slate-400 text-xs select-none text-right pr-2 overflow-hidden">
</div>

        <textarea id="code-editor" spellcheck="false" class="flex-1 p-4 focus:outline-none resize-none code-font text-sm leading-relaxed text-slate-700">
public class Main {
    public static void main(String[] args) {
        System.out.println("Hello, Hytechsoft Java Cloud!");
        
        int a = 10;
        int b = 20;
        System.out.println("Sum of " + a + " and " + b + " is: " + (a + b));
    }
}
        </textarea>
    </div>
  </section>

  <section class="flex flex-col bg-slate-900">
    <div class="flex items-center px-6 py-3 bg-slate-800 border-b border-slate-700">
        <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Console Output</span>
    </div>
    <div id="output-area" class="flex-1 p-6 code-font text-sm text-emerald-400 overflow-y-auto leading-relaxed whitespace-pre-wrap">
Welcome to HytechSoft Java Runtime. 
Click "Run Code" to execute your program...
    </div>
    
    <div class="px-6 py-3 bg-slate-800 border-t border-slate-700 flex justify-between items-center text-[10px] font-bold text-slate-500 uppercase tracking-widest">
        <div id="exec-time">Execution: 0ms</div>
        <div class="flex items-center gap-2">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>
            Cloud Engine Ready
        </div>
    </div>
  </section>

</main>

<script>
const runBtn = document.getElementById('run-btn');
  const codeEditor = document.getElementById('code-editor');
  const outputArea = document.getElementById('output-area');
  const lineNumbers = document.getElementById("line-numbers");
  const execTime = document.getElementById('exec-time');

  // --- 1. Line Number Logic ---
  function updateLineNumbers() {
    const lines = codeEditor.value.split("\n").length;
    let output = "";
    for (let i = 1; i <= lines; i++) {
      output += i + "<br>";
    }
    lineNumbers.innerHTML = output;
  }

  codeEditor.addEventListener("input", updateLineNumbers);
  codeEditor.addEventListener("scroll", () => {
    lineNumbers.scrollTop = codeEditor.scrollTop;
  });
  updateLineNumbers(); // Initial call

  // --- 2. Reliable Execution Logic (Piston API) ---
  runBtn.onclick = async () => {
    const code = codeEditor.value;
    
    // UI State
    runBtn.disabled = true;
    runBtn.innerHTML = `<span>⏳ Running...</span>`;
    outputArea.innerText = "Processing output...";
    outputArea.classList.remove('text-red-400');
    
    try {
        const response = await fetch('https://emkc.org/api/v2/piston/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                language: 'java',
                version: '*', 
                files: [
                    {
                        name: 'Main.java', // CRITICAL: Java needs this exact name
                        content: code 
                    }
                ]
            })
        });

        const data = await response.json();
        console.log("Full Server Response:", data); // Check this in F12 Console

        // Piston 2.0 structure: data.run.stdout and data.run.stderr
        const stdout = data.run.output || data.run.stdout;
        const stderr = data.run.stderr;

        if (stderr) {
            outputArea.classList.add('text-red-400');
            outputArea.innerText = stderr;
        } else {
            outputArea.innerText = stdout || "Program executed (no output).";
        }

    } catch (err) {
        outputArea.classList.add('text-red-400');
        outputArea.innerText = "Frontend Error: " + err.message;
    } finally {
        runBtn.disabled = false;
        runBtn.innerHTML = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Run Code`;
    }
};
</script>

</body>
</html>
